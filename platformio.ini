; Default environment - ESP8266 demo is the primary target
[platformio]
default_envs = demo_esp8266

; Primary test environment - ESP8266
[env:test_esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_deps = 
    throwtheswitch/Unity@^2.5.2
build_flags = 
    -I include  
    -I test
    -D UNIT_TEST
lib_extra_dirs = test
test_framework = unity
test_build_src = yes
test_filter = test_main.cpp
src_filter = 
    +<*> 
    -<main.cpp>
monitor_speed = 115200
upload_speed = 921600

; Secondary test environment - ESP32
[env:test_esp32]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
    throwtheswitch/Unity@^2.5.2
build_flags = 
    -I include
    -I test
    -D UNIT_TEST
lib_extra_dirs = test
test_framework = unity
test_build_src = yes
test_filter = test_main.cpp
src_filter = 
    +<*> 
    -<main.cpp>
monitor_speed = 115200
upload_speed = 921600

; Demo environment - ESP8266 (primary)
[env:demo_esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
build_flags = 
    -I include
    -I test
    -D DEMO_MODE
monitor_speed = 115200
upload_speed = 921600
monitor_filters = 
    default
    time
monitor_eol = CRLF
monitor_echo = yes

; Demo environment - ESP32 (secondary)
[env:demo_esp32]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = 
    -I include
    -I test
    -D DEMO_MODE
monitor_speed = 115200
upload_speed = 921600

; Native test environment (optional - hardware testing preferred)
[env:test_native]
platform = native
test_framework = unity
lib_deps = 
    throwtheswitch/Unity@^2.5.2
build_flags = 
    -D NATIVE_TEST
    -std=c++17
    -I test
lib_extra_dirs = test
test_build_src = no
test_filter = test_native.cpp

; Simple standalone AC demo (no library dependencies)
[env:simple_demo_esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
build_flags = 
    -D SIMPLE_DEMO
build_src_filter = 
    +<examples/simple/>
    -<src/>
    -<test/>
monitor_speed = 115200
upload_speed = 921600
monitor_filters = 
    default
    time
monitor_eol = CRLF
monitor_echo = yes
